<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2b1d17"
    >

    <title>404 — Nexo Café</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --espresso: #2b1d17;
            --cream: #f4ebdd;
            --caramel: #b8753d;
            --white: #fffaf3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100svh;

            display: grid;
            place-items: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(184,117,61,.2),
                    transparent 35%
                ),
                var(--espresso);

            color: var(--white);

            font-family: "DM Sans", sans-serif;

            text-align: center;
        }

        main {
            max-width: 650px;
        }

        .logo {
            width: 55px;
            height: 55px;

            display: grid;
            place-items: center;

            margin: 0 auto 30px;

            border: 1px solid rgba(255,255,255,.35);
            border-radius: 50%;

            font-family: "Playfair Display", serif;
            font-size: 28px;
        }

        .code {
            color: var(--caramel);

            font-size: 12px;
            font-weight: 700;
            letter-spacing: .25em;
        }

        h1 {
            margin: 18px 0;

            font-family: "Playfair Display", serif;
            font-size: clamp(64px, 15vw, 120px);
            font-weight: 500;
            line-height: .9;
        }

        h1 em {
            color: #d59a62;
        }

        p {
            max-width: 470px;

            margin: 0 auto;

            color: rgba(255,250,243,.62);

            line-height: 1.7;
        }

        a {
            display: inline-flex;

            margin-top: 35px;
            padding: 15px 23px;

            border-radius: 999px;

            background: var(--caramel);
            color: var(--white);

            font-size: 12px;
            font-weight: 700;

            text-decoration: none;

            transition: .3s ease;
        }

        a:hover {
            transform: translateY(-3px);
            background: #d59a62;
        }
    </style>
</head>

<body>

<main>

    <div class="logo">N</div>

    <span class="code">ERRO 404</span>

    <h1>
        Café<br>
        <em>perdido.</em>
    </h1>

    <p>
        Parece que essa página tomou um café e saiu por aí.
        Mas relaxa — o Nexo ainda está aqui.
    </p>

    <a href="./">
        Voltar para o Nexo →
    </a>

</main>

</body>
</html>
